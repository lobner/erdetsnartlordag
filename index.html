<script>
  var weekdaysLower = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
  var now = new Date();
  var weekday = now.getDay();
  var weekdayName = weekdaysLower[weekday];

  var daysUntilSaturday = (6 - weekday + 7) % 7;
  if (daysUntilSaturday === 0) daysUntilSaturday = 7;
  var saturday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilSaturday, 0, 0, 0, 0);

  TargetDate = saturday.toString();
  BackColor = "white";
  ForeColor = "black";
  CountActive = true;
  CountStepper = -1;
  LeadingZero = false;
  if (weekday > 4) {
    DisplayFormat = "%%H%% timer, %%M%%  minutter og %%S%%  sekunder.";
  } else {
    DisplayFormat = "%%D%% " + (weekday === 4 ? "dag" : "dage") + ", %%H%% timer, %%M%%  minutter og %%S%%  sekunder.";
  }
  FinishMessage = "Det er lørdag!";

  // After `wrangler deploy`, swap in the deployed Worker URL.
  var COUNTER_URL = "https://erdetsnartlordag-counter.s-rens-account.workers.dev";

  function hitcount(callback) {
    var last = parseInt(localStorage.getItem("visitorLast") || "0", 10);
    var nowMs = Date.now();
    var shouldBump = nowMs - last > 3600 * 1000;
    var method = shouldBump ? "POST" : "GET";

    fetch(COUNTER_URL, { method: method })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (shouldBump) localStorage.setItem("visitorLast", nowMs.toString());
        callback(data.count || 0);
      })
      .catch(function() { callback(0); });
  }
</script>

<script>
  if (weekday === 6) {
    document.write('<h1>Det ER lørdag... fedtfjæs...</h1>');

      '<h1>NEJ!! - det er ikke LØRDAG din klaphat!<br />' +
      '...det er jo ' + weekdayName + '.</h1>' +
      '<img src="' + weekdayName + '.jpg" alt="Billede af en fed lort!" /> <br />' +
      '<div>Det er lørdag om:&nbsp;&nbsp;'
    );
    document.write('<script src="countdown.js"><\/script>');
    document.write('</div><h2>Kom endelig igen en anden gang!</h2></div>');
  }
</script>

<div id="hitcount"></div>
<script>
  hitcount(function(hits) {
    document.getElementById('hitcount').textContent = 'Danne sidan er blivt fangat ' + hits + ' gånga i ahlt';
